services:
  lambda:
    build:
      context: .
      dockerfile: Dockerfile
    image: fastapi-fastmcp-lambdadocker:local
    ports:
      - "9001:8080"
    environment:
      COGNITO_REGION: ${COGNITO_REGION:?Set COGNITO_REGION in .env}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:?Set COGNITO_USER_POOL_ID in .env}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:?Set COGNITO_CLIENT_ID in .env}
      COGNITO_DOMAIN: ${COGNITO_DOMAIN:?Set COGNITO_DOMAIN in .env}
      COGNITO_REDIRECT_URI: ${COGNITO_REDIRECT_URI:?Set COGNITO_REDIRECT_URI in .env}
      COGNITO_SCOPES: ${COGNITO_SCOPES:-openid}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN:-}
      GOOGLE_OAUTH_INTERACTIVE: "false"
      GOOGLE_TOKEN_FILE: /tmp/gmail-mcp/gmail-user-token.json