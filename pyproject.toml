[project]
name = "mcp-examples"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bnaveeng9", email = "naveeng9@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncio>=4.0.0",
    "fastapi>=0.162.0",
    "fastmcp>=4.1.3",
    "ipykernel>=7.4.0",
    "magnum>=23.0.0",
    "mangum>=0.22.0",
    "mcp>=2.3.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
mcp-examples = "mcp_examples:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
